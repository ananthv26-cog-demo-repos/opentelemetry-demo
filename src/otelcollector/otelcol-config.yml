receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

exporters:
  otlp_grpc:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
  debug:
  prometheus:
    endpoint: "0.0.0.0:9464"
    resource_constant_labels:
      included:
        - ".*"
    enable_open_metrics: true

processors:
  batch:

connectors:
  span_metrics:

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_grpc, span_metrics]
    metrics:
      receivers: [otlp, span_metrics]
      processors: [batch]
      exporters: [prometheus, debug]
