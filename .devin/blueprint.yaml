# https://docs.devin.ai/onboard-devin/environment-yaml
# One-time setup (e.g., install system tools, global CLIs).
initialize:
  - name: docker hub pulls via mirror (anonymous docker.io pulls get 429-rate-limited)
    run: |
      sudo python3 - <<'EOF'
      import json, os
      p = '/etc/docker/daemon.json'
      d = json.load(open(p)) if os.path.exists(p) else {}
      d['registry-mirrors'] = ['https://mirror.gcr.io']
      json.dump(d, open(p, 'w'), indent=2)
      EOF
      sudo systemctl restart docker
  - name: grpcurl + grpc_health_probe for runtime proof
    run: |
      curl -sSfL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin grpcurl
      curl -sSfL -o /tmp/grpc_health_probe https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v0.4.39/grpc_health_probe-linux-amd64
      sudo install -m755 /tmp/grpc_health_probe /usr/local/bin/grpc_health_probe
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  docker compose pull --quiet --ignore-pull-failures
  docker compose build integrationTests
knowledge:
  - name: build-and-run-one-service
    contents: |
      docker compose build <svc> && docker compose up -d --no-build <svc>   # deps come from ghcr.io/open-telemetry/demo:1.3.0-*
      docker compose ps; docker compose logs <svc> --tail=50
  - name: black-box-test-one-service
    contents: |
      # test names are prefixed ad|cart|checkout|currency|email|payment|product|recommendation|shipping (see test/test.js)
      docker compose run --rm --no-deps --entrypoint "npx ava --match='payment:*'" integrationTests
  - name: runtime-proof
    contents: |
      addr=$(docker compose port paymentservice 50051)          # host ports are ephemeral
      grpc_health_probe -addr "$addr"                           # -> status: SERVING
      grpcurl -plaintext -import-path pb -proto demo.proto "$addr" list
      docker exec payment-service node --version                # prove the runtime inside the container
      docker inspect payment-service --format 'OOM={{.State.OOMKilled}} restarts={{.RestartCount}}'
  - name: full-stack
    contents: |
      docker compose up -d && docker compose run --rm --no-deps integrationTests   # all 17 black-box tests
      # shop UI: http://localhost:8080  (frontendproxy/envoy)
  - name: ci
    contents: |
      .github/workflows/build-and-blackbox.yml runs per changed src/<svc>/** dir on PRs: build image, 60s stability, black-box tests.
      Manual: gh workflow run build-and-blackbox.yml -f services='["cartservice"]'
  - name: gotchas
    contents: |
      docker-compose.yml memory limits are tight (deploy.resources.limits) — an OOMKilled container shows as "Restarting"; check `docker inspect --format '{{.State.OOMKilled}}'`.
      Lint checks (checks.yml) run `npm install` + make markdownlint/yamllint/misspell at repo root.
      checkout:* and shipping:* black-box tests need quoteservice up: `docker compose up -d --no-build quoteservice` first (compose lacks the depends_on).
      `recommendation: list products` is flaky against the pulled ghcr 1.3.0 recommendationservice image
      (upstream bug fixed on main, but that service doesn't build on main); a rebuilt image passes deterministically.
      Distroless/alpine release images have no toolchain: prove Go/Rust runtime via
      `docker exec <c> cat /proc/1/exe | strings | grep 'go1\.'` or the build stage's `go version`, not `go version` in the container.
      CHANGELOG.md is a shared root file — per-service runtime bumps must NOT edit it (Devin Review will ask; decline in-thread).
  - name: maven-central-429
    contents: |
      Java/Kotlin image builds (adservice, frauddetectionservice, kafka agent) can hit HTTP 429 from repo.maven.apache.org on this VM's egress IP.
      Mirror: https://maven-central.storage-download.googleapis.com/maven2/
      (add as a repository in build.gradle / settings.xml inside the Dockerfile build stage, or retry after ~30 min).
